[features]
default = ["t3"]

# Core T3 oscillator engine (oscillator + PST + decoders)
t3 = ["taas-t3"]

# Training (BPTT, SPIGRAD, connectome chase)
train = ["taas-train/t3"]

# Connectome brain simulator (also exposes connectome_chase in train)
connectome = ["taas-connectome", "taas-train/connectome"]

# Cognitive architecture (GNW, LOD, BasalGanglia)
karmac = ["dep:karmac"]

# GPU acceleration — compound feature, implies t3 + connectome
cuda = ["t3", "connectome",
        "cuda-kernels",
        "taas-t3/cuda",
        "taas-connectome/cuda",
        "taas-train/cuda"]

# Python bindings
python = ["dep:pyo3", "dep:numpy", "connectome", "t3", "taas-train/connectome", "karmac"]

# Unity C ABI
unity = ["dep:taas-unity", "connectome"]

# Everything
all = ["t3", "train", "connectome", "karmac", "cuda", "python", "unity"]
