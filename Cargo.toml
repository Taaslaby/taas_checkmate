[workspace]
resolver = "2"
members = [
    "crates/kernels", "crates/t3", "crates/cuda", "crates/connectome",
    "crates/core",     "crates/train",
    "crates/taas-format",
    "crates/connectome-gpt",
    "crates/cpe",
    "crates/karmac",
    "crates/unity",
    "crates/gpu-eval",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["TaasLab <taaslab@proton.me>"]
license = "GPL-3.0-only"
repository = "https://github.com/anomalyco/taas-checkmate"
homepage = "https://taaslab.ai"
readme = "README.md"
keywords = ["neural", "simd", "spiking-neural-networks", "brain-simulation", "wavelets"]
categories = ["science::neuroscience", "science::robotics", "algorithms::machine-learning"]

[package]
name = "taas-checkmate"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Pure Rust wavelet neural engine — SIMD, CUDA, FlyWire connectome"

[lib]
crate-type = ["cdylib", "lib"]
name = "taas_checkmate"

[dependencies]
# Internal crates (always present)
taas-kernels = { path = "crates/kernels" }
taas-core = { path = "crates/core" }
taas-train = { path = "crates/train" }
taas-format = { path = "crates/taas-format", features = ["train"] }
taas-cpe = { path = "crates/cpe" }

# Internal crates (optional, behind features)
taas-t3 = { path = "crates/t3", optional = true }
cuda-kernels = { path = "crates/cuda", optional = true }
taas-connectome = { path = "crates/connectome", optional = true }
karmac = { path = "crates/karmac", optional = true }
taas-unity = { path = "crates/unity", optional = true }

# External dependencies
rayon = "1"
wide = "0.7"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytemuck = { version = "1", features = ["extern_crate_alloc"] }
pyo3 = { version = "0.23", features = ["extension-module", "abi3", "abi3-py311"], optional = true }
numpy = { version = "0.23", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "bench"
harness = false

[[bench]]
name = "bench_all"
harness = false

