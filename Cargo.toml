[workspace]
resolver = "2"
members = [
    "crates/pillars", "crates/pillars-macros", "crates/pillars-cuda",
    "crates/pillars-connectome",
    "crates/t3",
    "crates/train",
    "crates/taas-format",
    "crates/connscope",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["TaasLab <taaslab@proton.me>"]
license = "GPL-3.0-only"
repository = "https://github.com/anomalyco/taas-checkmate"
homepage = "https://taaslab.ai"
readme = "README.md"
keywords = ["neural", "simd", "spiking-neural-networks", "brain-simulation", "wavelets"]
categories = ["science::neuroscience", "science::robotics", "algorithms::machine-learning"]
# ── GUI (connscope) — единый источник версий egui-семейства ──────────
# Правило: ОДИН минор egui на всё приложение (сейчас 0.35). Каждый плагин
# мапится на свой egui минор; источник правды — `cargo tree -i egui` должен
# показывать ровно одну версию. Не поднимай плагин до версии, требующей
# более новый egui, не подняв одновременно eframe.
[workspace.dependencies]
# `persistence` — сохраняет egui Memory (панели + `insert_persisted`) на диск
# между запусками; без неё персистентная раскладка дока жила бы только в сессии.
eframe = { version = "0.35", features = ["wgpu", "persistence"] }
egui-elegance = "0.14"
egui_graphs = "0.31"
egui-phosphor = { version = "0.13", default-features = false, features = ["regular", "bold"] }
# egui_plot версионится независимо: 0.36 всё ещё собирается на egui 0.35.
egui_plot = "0.36"
egui-wgpu = "0.35"
# Докинг для egui 0.35 (0.21 уже требует egui 0.36 / edition 2024 — не трогаем).
# `serde` — персистентность DockState. Пока объявлен «на будущее»: ни один
# крейт его ещё не использует.
egui_dock = { version = "0.20", features = ["serde"] }

[package]
name = "taas-checkmate"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Pure Rust wavelet neural engine — SIMD, CUDA, FlyWire connectome"

[lib]
crate-type = ["cdylib", "lib"]
name = "taas_checkmate"

[dependencies]
# Internal crates (always present)
pillars = { path = "crates/pillars" }
pillars-connectome = { path = "crates/pillars-connectome", optional = true }
taas-train = { path = "crates/train" }
taas-format = { path = "crates/taas-format", features = ["train"], optional = true }

# Internal crates (optional, behind features)
taas-t3 = { path = "crates/t3", optional = true }
pillars-cuda = { path = "crates/pillars-cuda", optional = true }

# External dependencies
rayon = "1"
wide = "0.7"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = { version = "0.2", optional = true }
bytemuck = { version = "1", features = ["extern_crate_alloc"] }
pyo3 = { version = "0.23", features = ["extension-module", "abi3", "abi3-py311"], optional = true }
numpy = { version = "0.23", optional = true }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
# getrandom 0.2 (pulled in by rand 0.8) needs the "js" backend on wasm32-unknown-unknown.
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "bench"
harness = false

[[bench]]
name = "bench_all"
harness = false

[[bench]]
name = "bench_lod_gnw"
harness = false
required-features = ["karmac"]

[[bench]]
name = "bench_spikegpt_forward"
harness = false

[[example]]
name = "spikegpt_infer"

[[example]]
name = "cognitive_arena"
required-features = ["karmac"]

[[example]]
name = "hide_seek_arena"
required-features = ["karmac"]

[features]
default = ["t3", "format"]

# Core T3 oscillator engine (oscillator + PST + decoders)
t3 = ["taas-t3"]

# .taas save/load format (pulls zstd; excluded from the wasm build so no C
# cross-compiler is required for the browser package)
format = ["dep:taas-format"]

# Training (BPTT, SPIGRAD, connectome chase)
train = ["taas-train/t3"]

# Connectome brain simulator (also exposes connectome_chase in train)
connectome = ["dep:pillars-connectome", "taas-train/connectome"]

# Cognitive architecture (GNW, LOD, BasalGanglia) — встроено в корневой крейт
karmac = []
# JavaScript/WASM facade over the Rust-owned Cognitive Arena state machine
wasm = ["karmac", "dep:wasm-bindgen"]

# GPU acceleration — compound feature, implies t3 + connectome
cuda = ["t3", "connectome",
        "dep:pillars-cuda",
        "taas-t3/cuda",
        "pillars-connectome/cuda",
        "taas-train/cuda"]

# Python bindings
python = ["dep:pyo3", "dep:numpy", "dep:pillars-connectome", "connectome", "t3", "format", "taas-train/connectome", "karmac"]

# Unity C ABI (inlined in main crate, like python)
unity = ["connectome"]

# Everything
all = ["t3", "train", "format", "connectome", "karmac", "wasm", "cuda", "python", "unity"]
