name: CI

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "docs/**"
      - "notebooks/**"
      - "research/**"
      - "*.md"
      - "*.py"
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --no-default-features -- -D warnings

      - name: Build (no features)
        run: cargo build --no-default-features

      - name: Run tests (lib + integration)
        run: cargo test --no-default-features

      - name: Build with python feature (static check)
        run: cargo check --features python

      - name: Bench check (compilation only)
        run: cargo bench --no-default-features --bench bench -- --list

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build with python
        run: |
          pip install numpy
          cargo build --features python

      - name: Test with python
        run: cargo test --features python
