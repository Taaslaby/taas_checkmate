name: CI

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "docs/**"
      - "notebooks/**"
      - "research/**"
      - "*.md"
      - "*.py"
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --check

      - name: Clippy (no features)
        run: cargo clippy --no-default-features -- -D warnings

      # Every feature EXCEPT `cuda`/`python`. `cuda` → cuda-kernels → its
      # build.rs compiles .cu with nvcc and panics "nvcc not found" on runners
      # without a CUDA toolkit (ubuntu-latest has none). `python` needs numpy
      # headers at build time — covered by the dedicated `python` job below.
      # Same strategy as the `windows` job's `--exclude cuda-kernels`.
      - name: Clippy (all features, no CUDA)
        run: cargo clippy --features "t3,train,connectome,karmac,unity" -- -D warnings

      # Opt-in precise-exp mode for HH gates — compiled nowhere else, so a
      # regression here would rot silently. Default build keeps fast_exp.
      - name: Clippy (hh-precise-gates)
        run: cargo clippy -p pillars --features hh-precise-gates --lib -- -D warnings

      - name: Build (no features)
        run: cargo build --no-default-features

      - name: Build (all features, no CUDA)
        run: cargo build --features "t3,train,connectome,karmac,unity"

      - name: Run tests (no features)
        run: cargo test --no-default-features

      - name: Run tests (all features, no CUDA)
        run: cargo test --features "t3,train,connectome,karmac,unity"

      - name: Run kernel progonator tests (integration)
        run: cargo test -p taas-kernels --test kernel_progon

      - name: Bench check (compilation only)
        run: cargo bench --no-default-features --bench bench -- --list

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build with python
        run: |
          pip install numpy
          cargo build --features python

      - name: Test with python
        run: cargo test --features python

      - name: Smoke test (runtime API)
        # The smoke test caught a real root-name collision before —
        # keep it in CI as a runtime regression guard.
        run: |
          pip install maturin numpy
          maturin build
          pip install --force-reinstall --no-deps target/wheels/*.whl
          python tests/test_smoke_api.py

  windows:
    # Windows (MSVC) migration guard — no nvcc on these runners, so
    # cuda-kernels is excluded (its build.rs panics: "nvcc not found").
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check workspace (no cuda)
        run: cargo check --workspace --exclude cuda-kernels

      - name: Clippy pillars
        run: cargo clippy -p pillars --lib -- -D warnings

      - name: Test workspace (no cuda)
        run: cargo test --workspace --exclude cuda-kernels

      - name: Check examples
        run: cargo check -p pillars --examples

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check python bindings
        run: cargo check --features python
