<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🦗 VNC Walking Fly</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0a0a0f;
    color: #e0e0e0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }
  .container { max-width: 800px; padding: 20px; text-align: center; }
  h1 { font-size: 1.8em; margin-bottom: 8px; background: linear-gradient(135deg, #ff6b6b, #ffd93d, #6bcbff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .subtitle { color: #888; margin-bottom: 24px; font-size: 0.95em; }
  .video-container {
    background: #111;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid #222;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .video-container img { width: 100%; display: block; }
  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin: 24px 0;
  }
  .stat-card {
    background: #111;
    border: 1px solid #222;
    border-radius: 12px;
    padding: 16px;
  }
  .stat-value { font-size: 1.6em; font-weight: bold; color: #ffd93d; }
  .stat-label { font-size: 0.8em; color: #666; margin-top: 4px; }
  .badge {
    display: inline-block;
    background: linear-gradient(135deg, #00b894, #00cec9);
    color: #000;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 0.8em;
    font-weight: bold;
    margin-top: 16px;
  }
  .footer { margin-top: 24px; color: #444; font-size: 0.8em; }
  .controls { margin-top: 12px; }
  .controls button {
    background: #222;
    color: #e0e0e0;
    border: 1px solid #333;
    padding: 8px 20px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.9em;
    margin: 0 4px;
  }
  .controls button:hover { background: #333; }
</style>
</head>
<body>
<div class="container">
  <h1>🦗 VNC → HH → Atlasov → MuJoCo</h1>
  <p class="subtitle">Реальный VNC коннектом (25K нейронов) управляет ходьбой мухи</p>

  <div class="video-container">
    <img src="vnc_real_walk_realistic.webp" alt="Walking Fly" id="walkVideo">
  </div>
  <div class="controls">
    <button onclick="document.getElementById('walkVideo').style.animationPlayState='running'">▶ Play</button>
    <button onclick="document.getElementById('walkVideo').style.animationPlayState='paused'">⏸ Pause</button>
    <button onclick="document.getElementById('walkVideo').src='vnc_real_walk_realistic.webp?'+new Date().getTime()">🔄 Restart</button>
  </div>

  <div class="stats">
    <div class="stat-card">
      <div class="stat-value">25,531</div>
      <div class="stat-label">VNC Нейронов</div>
    </div>
    <div class="stat-card">
      <div class="stat-value">7.1</div>
      <div class="stat-label">Скорость мм/с</div>
    </div>
    <div class="stat-card">
      <div class="stat-value">2.4</div>
      <div class="stat-label">BL/s (body-lengths)</div>
    </div>
  </div>

  <div class="badge">✅ CPG REAL — 7 mm/s при реалистичном clip=0.005</div>
  <div class="footer">VNC Connectome (25K) → HH pacemaking → Atlasov Ca²⁺ → MuJoCo 3D</div>
</div>

<script>
// Force WebP to loop by reloading on end
var img = document.getElementById('walkVideo');
img.addEventListener('load', function() {
  setTimeout(function() {
    img.src = 'vnc_real_walk_realistic.webp?' + new Date().getTime();
  }, 5000);
});
</script>
</body>
</html>
