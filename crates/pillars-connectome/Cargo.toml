[package]
name = "pillars-connectome"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Universal connectome brain simulator — pillars-native engine + sim_* API"

[dependencies]
pillars = { path = "../pillars" }
pillars-cuda = { path = "../pillars-cuda", optional = true }
prometheus-grow = { path = "../prometheus-grow" }
serde = { version = "1", features = ["derive"] }
rand = "0.8"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
rand = "0.8"

[features]
default = ["rayon"]
rayon = ["pillars/rayon"]
cuda = ["pillars-cuda"]

[[bench]]
name = "bench_rcm"
harness = false

[[bench]]
name = "bench_hh_parity"
harness = false

[[example]]
name = "flywire_sugar_gpu"
required-features = ["cuda"]
