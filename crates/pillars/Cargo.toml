[package]
name = "pillars"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Pillars — reusable SIMD bio primitives for neural computation"

[dependencies]
roxmltree = "0.20"
wide = "0.7"
bytemuck = { version = "1", features = ["extern_crate_alloc"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }
rayon = { version = "1.8", optional = true }
pillars-macros = { path = "../pillars-macros" }

[[bench]]
name = "bench_lif"
harness = false

[[bench]]
name = "bench_hh"
harness = false

[[bench]]
name = "bench_glif4_haap"
harness = false

[[bench]]
name = "bench_lif_par"
harness = false
required-features = ["rayon"]

[[bench]]
name = "bench_formula"
harness = false

[[bench]]
name = "bench_cable"
harness = false

[features]
default = ["rayon", "hh-precise-gates"]
rayon = ["dep:rayon"]
# JSON-эталоны NEURON/Brian2 в api::validate (файлы gen_*_ref.py).
# Опционально, чтобы не тащить serde_json в основной сборке.
validate-json = ["dep:serde_json"]
# Переключатель точности: включает полиномиальную аппроксимацию exp()
# в SimdLane (~1e-5 rel err вместо ~1 ULP). Модели не меняются —
# exp() маршрутизируется на fast_exp() на этапе компиляции.
fast-exp = []
# Точный exp() в HH gates (вместо fast_exp). В дефолте по результатам аудита
# точности (bench_hh_precision): fast_exp даёт линейный дрейф спайк-тайминга
# ~3 мс/с (0.4 мс на 10 спайков), точный exp — 0.008 мс/с (390x лучше)
# без измеримой потери производительности.
hh-precise-gates = []

[dev-dependencies]
pillars-macros = { path = "../pillars-macros" }
rand = "0.8"
criterion = { version = "0.5", features = ["rayon"] }
num_cpus = "1.0"

# Экспериментальный нод-редактор нейронов (examples/viz_neuron_builder.rs)
eframe = "0.27"
egui_plot = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
