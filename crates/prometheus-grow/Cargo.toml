[package]
name = "prometheus-grow"
version = "0.1.0"
edition = "2021"
description = "Developmental growth engine — CX3D-style morphogen-guided self-construction (Rust port of the instruction-language core)"

[dependencies]
rand = { workspace = true }
flate2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rayon = { workspace = true }

# wgpu GPU acceleration (feature "gpu")
wgpu = { version = "0.19", optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }

[features]
default = []
gpu = ["wgpu", "bytemuck"]

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }

# CX3D tutorial ports (examples/cx3d/)
[[example]]
name = "cx3d_01_soma_random_walk"
path = "examples/cx3d/cx3d_01_soma_random_walk.rs"

