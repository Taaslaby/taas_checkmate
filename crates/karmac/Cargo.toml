[package]
name = "karmac"
version.workspace = true
edition.workspace = true
description = "GNW (Global Neuronal Workspace) + LOD (Carmack BSP neuron system)"

[dependencies]
rand = "0.8"
rayon = "1"

[dev-dependencies]
