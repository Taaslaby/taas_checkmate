[package]
name = "taas-format"
version.workspace = true
edition.workspace = true
description = ".taas format — universal snapshot for SNN models and oscillators"

[dependencies]
pillars = { path = "../pillars" }
taas-connectome = { path = "../connectome" }
taas-t3 = { path = "../t3" }
taas-train = { path = "../train", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytemuck = { version = "1", features = ["extern_crate_alloc"] }
memmap2 = "0.9"
crc32fast = "1"
zstd = { version = "0.13", features = ["zstdmt"] }

[features]
default = ["train"]
train = ["dep:taas-train"]
