[package]
name = "taas-format"
version.workspace = true
edition.workspace = true
description = ".taas format — universal snapshot for SNN models and oscillators"

[dependencies]
taas-core = { path = "../core" }
taas-connectome = { path = "../connectome" }
taas-t3 = { path = "../t3" }
taas-train = { path = "../train" }
cuda-kernels = { path = "../cuda", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytemuck = { version = "1", features = ["extern_crate_alloc"] }

[features]
cuda = ["cuda-kernels"]
