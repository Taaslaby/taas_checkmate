[package]
name = "connectome-gpt"
version.workspace = true
edition = "2021"
description = "Generative connectome model — graph VAE for robotic brain synthesis"

[lib]
name = "connectome_gpt"

[dependencies]
taas-connectome = { path = "../connectome" }
taas-core = { path = "../core" }
taas-train = { path = "../train" }
taas-format = { path = "../taas-format" }

rand = "0.8"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
taas-kernels = { path = "../kernels" }
serde_json = "1"

[[bench]]
name = "bench"
harness = false
