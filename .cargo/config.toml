# Сборка под конкретное железо: включает AVX2/FMA, что даёт настоящие
# 256-битные пути в wide::f32x8 (иначе f32x8 эмулируется парой f32x4).
# Для research-движка это правильно; переносимость бинарей не требуется.
# Отключить для портабельной сборки: RUSTFLAGS="-C target-cpu=x86-64" cargo build ...
[build]
rustflags = ["-C", "target-cpu=native"]
