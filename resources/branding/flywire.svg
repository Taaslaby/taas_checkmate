<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- FlyWire dataset icon — blueprint style, muted steel-blue -->
  <rect x="12" y="12" width="232" height="232" rx="14" fill="#2A3441" stroke="#3A4A5E" stroke-width="1.5"/>
  <!-- blueprint grid -->
  <g stroke="#5BA3D0" stroke-width="0.7" opacity="0.22">
    <line x1="32" y1="48" x2="224" y2="48"/><line x1="32" y1="80" x2="224" y2="80"/><line x1="32" y1="112" x2="224" y2="112"/><line x1="32" y1="144" x2="224" y2="144"/><line x1="32" y1="176" x2="224" y2="176"/><line x1="32" y1="208" x2="224" y2="208"/>
    <line x1="48" y1="32" x2="48" y2="224"/><line x1="80" y1="32" x2="80" y2="224"/><line x1="112" y1="32" x2="112" y2="224"/><line x1="144" y1="32" x2="144" y2="224"/><line x1="176" y1="32" x2="176" y2="224"/><line x1="208" y1="32" x2="208" y2="224"/>
  </g>
  <!-- folded corner -->
