    <ellipse cx="92" cy="132" rx="28" ry="26"/>
    <ellipse cx="164" cy="132" rx="28" ry="26"/>
    <ellipse cx="108" cy="92" rx="26" ry="22"/>
    <ellipse cx="148" cy="92" rx="26" ry="22"/>
  </g>
  <!-- FlyWire label -->
  <text x="128" y="185" text-anchor="middle" font-family="'IBM Plex Sans', sans-serif" font-size="28" font-weight="600" fill="white" letter-spacing="0.5">FlyWire</text>
  <text x="128" y="205" text-anchor="middle" font-family="'IBM Plex Sans', sans-serif" font-size="11" font-weight="400" fill="#8AA0B8" letter-spacing="1.2">DATASET • 140k NEURONS</text>
</svg>
