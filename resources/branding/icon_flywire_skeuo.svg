<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="paperGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3A7BD5"/>
      <stop offset="100%" stop-color="#1E4A8A"/>
    </linearGradient>
    <linearGradient id="gloss2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="white" stop-opacity="0.28"/>
      <stop offset="50%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="black" flood-opacity="0.38"/>
    </filter>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="white" stroke-width="0.6" opacity="0.18"/>
    </pattern>
  </defs>
  <!-- paper -->
  <rect x="24" y="24" width="192" height="208" rx="6" fill="url(#paperGrad)" filter="url(#shadow2)" stroke="#1A3A5E" stroke-width="1.2"/>
  <rect x="24" y="24" width="192" height="208" rx="6" fill="url(#grid)"/>
  <!-- folded corner — glossy -->
  <path d="M 192 24 L 216 48 L 192 48 Z" fill="#6AA8DF" stroke="#2A5A8A" stroke-width="0.8"/>
  <path d="M 192 24 L 192 48 L 216 48" fill="none" stroke="white" stroke-width="1" opacity="0.45"/>
  <!-- gloss -->
  <rect x="24" y="24" width="192" height="80" rx="6" fill="url(#gloss2)"/>
  <!-- cloud brain — glossy white -->
  <g filter="url(#shadow2)">
    <ellipse cx="128" cy="116" rx="54" ry="38" fill="white" opacity="0.98"/>
    <ellipse cx="92" cy="128" rx="24" ry="22" fill="white"/>
    <ellipse cx="164" cy="128" rx="24" ry="22" fill="white"/>
    <ellipse cx="108" cy="94" rx="22" ry="18" fill="white"/>
    <ellipse cx="148" cy="94" rx="22" ry="18" fill="white"/>
    <ellipse cx="128" cy="112" rx="54" ry="18" fill="white" opacity="0.32"/>
  </g>
  <!-- FlyWire — embossed -->
  <text x="128" y="182" text-anchor="middle" font-family="'IBM Plex Sans', sans-serif" font-size="26" font-weight="700" fill="white" style="filter: drop-shadow(0 1px 1px rgba(0,0,0,0.5))" letter-spacing="0.3">FlyWire</text>
  <text x="128" y="200" text-anchor="middle" font-family="'IBM Plex Sans', sans-serif" font-size="9" font-weight="600" fill="#A8D8EA" letter-spacing="1.4">DATASET</text>
</svg>
